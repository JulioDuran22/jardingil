<html lang="es">
<head>

<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Santuario de Luz</title>

<!-- ═══════════════════════════════════════════════════════════════════════
     ✨ CONFIGURACIÓN — EDITA AQUÍ TODOS LOS TEXTOS ✨
     Todo lo personalizable está en este bloque. No necesitas tocar nada más.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
window.CONFIG = {

  // 🖼️ IMAGEN DE LA PANTALLA INICIAL
  //   ""                  → usa la flor de loto animada (SVG incluido, nunca falla).
  //   "./mi-imagen.gif"   → usa tu imagen/GIF local. Guárdala en la MISMA carpeta
  //                         que este index.html antes de arrastrarla a Netlify Drop.
  //   Si la imagen no carga por cualquier motivo, vuelve automáticamente al SVG.
  IMAGEN_INTRO_URL: "",

  // 🎵 MÚSICA LOCAL OPCIONAL
  //   ""               → usa el sintetizador mágico generado por código (recomendado).
  //   "./musica.mp3"   → reproduce tu canción (guárdala en la misma carpeta).
  //   Si el archivo falla, vuelve solo al sintetizador. Las notas de arpa siguen sonando.
  // MUSICA_LOCAL_URL: "./musica.mp3",
  MUSICA_LOCAL_URL: "",

  // 💬 PANTALLA DE BIENVENIDA
  TITULO_INTRO: "El Santuario de las Flores de Luz",
  NOTA_INTRO: "Creé un pequeño santuario de luz solo para ti. Sube un poco el volumen, desliza tu dedo por el aire y toca cada flor para descubrir lo que guardan…",
  TEXTO_BOTON: "Entrar al santuario",

  // 💡 PEQUEÑAS PISTAS QUE APARECEN DURANTE LA EXPERIENCIA
  PISTA_INICIAL: "Toca las flores que brillan alrededor del lago ✦",
  PISTA_AGUA: "También puedes tocar el agua para sembrar luz 💧",
  PISTA_CLIMAX: "El santuario floreció por completo… toca el corazón de luz en el árbol 💗",

  // 🌸 LAS 12 FLORES (título + versos). Puedes poner de 4 a 6 versos por flor.
  FLORES: [
    { titulo: "La flor de tu sonrisa", poema: [
      "Hay sonrisas que iluminan una habitación;",
      "la tuya ilumina mis días enteros.",
      "Cuando sonríes, el mundo baja la voz",
      "y todo lo que duele se vuelve pequeño.",
      "Si pudiera guardar un sol en el bolsillo,",
      "tendría la forma exacta de tu risa." ] },
    { titulo: "La flor de tu mirada", poema: [
      "En tus ojos encontré un lugar tranquilo,",
      "un lago quieto donde descansa mi prisa.",
      "Me miras, y de pronto entiendo",
      "que no hace falta decirlo todo:",
      "a veces basta con que me veas",
      "para sentir que ya llegué a casa." ] },
    { titulo: "La flor del primer día", poema: [
      "No sabía que ese día era especial,",
      "parecía uno más en el calendario.",
      "Pero algo de ti se quedó en mí",
      "como la luz que queda tras cerrar los ojos.",
      "Hoy lo sé: ese día empezó",
      "la historia que más quiero contar." ] },
    { titulo: "La flor de tu voz", poema: [
      "Tu voz tiene algo de canción de cuna",
      "y algo de amanecer.",
      "Me gusta cuando hablas de lo que amas,",
      "cuando te ríes a mitad de una frase,",
      "cuando dices mi nombre",
      "como si fuera un secreto bonito." ] },
    { titulo: "La flor de tu valentía", poema: [
      "Eres más fuerte de lo que crees,",
      "aunque a veces el mundo pese.",
      "Te he visto levantarte con el alma cansada",
      "y seguir brillando sin pedir aplausos.",
      "Admiro cada batalla que ganas en silencio,",
      "y estaré a tu lado en las que vengan." ] },
    { titulo: "La flor de nuestras charlas", poema: [
      "Las horas contigo se escapan sin permiso;",
      "hablamos de todo y de nada,",
      "de estrellas, de canciones, de tonterías,",
      "y aun así nunca me parece suficiente.",
      "Quiero mil madrugadas más",
      "de esas que no queremos que terminen." ] },
    { titulo: "La flor de tu ternura", poema: [
      "Tienes una forma de cuidar",
      "que no hace ruido, pero se nota:",
      "un mensaje a tiempo, un abrazo exacto,",
      "un sincero «¿cómo estás?».",
      "Gracias por ser refugio",
      "incluso en los días nublados." ] },
    { titulo: "La flor de los pequeños detalles", poema: [
      "Me enamoran tus manías más pequeñas:",
      "cómo arrugas la nariz cuando algo no te convence,",
      "cómo cantas bajito sin darte cuenta,",
      "cómo te emocionas con las cosas simples.",
      "Esos detalles que quizá nadie más ve",
      "son mis paisajes favoritos." ] },
    { titulo: "La flor de tus sueños", poema: [
      "Sueña en grande, que yo te sostengo la escalera.",
      "Quiero verte llegar a cada lugar",
      "que hoy solo existe en tu imaginación.",
      "Y cuando lo logres —porque lo lograrás—",
      "estaré en primera fila,",
      "aplaudiendo más fuerte que nadie." ] },
    { titulo: "La flor de la calma", poema: [
      "Contigo el tiempo se vuelve amable,",
      "el ruido del mundo se apaga un poco",
      "y aprendo a respirar despacio.",
      "Eres pausa, eres abrigo,",
      "ese silencio cómodo que solo existe",
      "entre dos personas que se quieren." ] },
    { titulo: "La flor del futuro", poema: [
      "No sé todo lo que vendrá,",
      "pero sé con quién quiero descubrirlo:",
      "viajes, cafés, risas, domingos lentos,",
      "días difíciles y días de fiesta.",
      "Cada mañana que imagino",
      "tiene tu nombre escrito en la luz." ] },
    { titulo: "La flor de lo que somos", poema: [
      "Lo nuestro no cabe en una palabra,",
      "pero si tuviera que elegir una, sería «hogar».",
      "Somos dos luces que se encontraron",
      "en medio de un bosque inmenso,",
      "y desde entonces la noche",
      "ya no da miedo." ] }
  ],

  // 💌 CARTA SECRETA FINAL (aparece al abrir las 12 flores y tocar el corazón)
  CARTA_FINAL: {
    titulo: "Carta secreta",
    etiquetaFecha: "Una fecha que vive en mi corazón",
    fecha: "14 de febrero de 2025",          // ← cambia por vuestra fecha especial
    saludo: "Para ti, que eres mi lugar favorito:",
    mensaje: [
      "Si llegaste hasta aquí es porque abriste cada flor, una por una, con esa paciencia y esa curiosidad tan tuyas. Cada una guardaba un pedacito de lo que siento, pero ninguna alcanza para decirlo todo.",
      "Construí este santuario porque quería regalarte algo que no se gaste: un lugar donde siempre sea de noche bonita, donde la luz te siga cuando mueves la mano y donde cada rincón te recuerde lo especial que eres.",
      "Gracias por existir así, tan tú. Por tu risa, por tu calma, por las conversaciones infinitas y por hacer que lo cotidiano parezca magia.",
      "Quiero seguir sembrando luz a tu lado, hoy y en todas las noches que vengan."
    ],
    firma: "Con todo lo que soy,\ntu persona favorita ♡"
  }
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg1:#030812; --bg2:#0a192f;
    --cyan:#5ff3ff; --violet:#b07cff; --magenta:#ff5fd2; --gold:#ffd27a;
    --text:#eef7ff; --muted:#a9bfd9;
    --accent:#5ff3ff;
    --serif:'Cormorant Garamond', 'Times New Roman', Georgia, serif;
    --sans:'Quicksand', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg1);color:var(--text);font-family:var(--sans)}
  body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}

  /* ───────────── INTRO ───────────── */
  #intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 8%, var(--bg2) 0%, #071228 45%, var(--bg1) 100%);
    transition:opacity 1.3s ease, visibility 1.3s ease;overflow-y:auto}
  #intro.leaving{opacity:0;visibility:hidden;pointer-events:none}
  .ff-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff4b0;
    box-shadow:0 0 6px 2px rgba(255,232,130,.85),0 0 18px 6px rgba(255,210,90,.28);
    animation:ffDrift var(--d) ease-in-out infinite alternate, ffBlink var(--b) ease-in-out infinite;opacity:.0}
  .ff.c{background:#c9fbff;box-shadow:0 0 6px 2px rgba(110,245,255,.85),0 0 18px 6px rgba(95,243,255,.25)}
  @keyframes ffDrift{from{transform:translate(0,0)}to{transform:translate(var(--x),var(--y))}}
  @keyframes ffBlink{0%,100%{opacity:.1}50%{opacity:.95}}

  .intro-card{position:relative;width:min(92vw,430px);padding:26px 24px 22px;border-radius:28px;text-align:center;margin:auto;
    background:linear-gradient(160deg,rgba(28,50,92,.42),rgba(10,18,42,.34));
    -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(160,205,255,.14);
    box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 60px rgba(130,95,255,.18),0 0 120px rgba(60,220,255,.08), inset 0 1px 0 rgba(255,255,255,.06);
    animation:cardIn 1.5s cubic-bezier(.2,.8,.2,1) both}
  .intro-card::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.2px;pointer-events:none;
    background:linear-gradient(140deg,rgba(95,243,255,.75),rgba(176,124,255,.12) 38%,rgba(255,95,210,.08) 62%,rgba(176,124,255,.75));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.85}
  @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

  .intro-visual{position:relative;width:min(60vw,230px);height:min(60vw,230px);margin:-6px auto 4px;animation:float 6s ease-in-out infinite}
  .intro-visual::before{content:'';position:absolute;inset:6%;border-radius:50%;
    background:radial-gradient(circle,rgba(95,243,255,.30),rgba(176,124,255,.16) 45%,transparent 70%);
    filter:blur(12px);animation:auraPulse 4s ease-in-out infinite}
  .intro-visual svg,.intro-visual img{position:relative;width:100%;height:100%;display:block}
  .intro-visual img{object-fit:cover;border-radius:24px;border:1px solid rgba(160,220,255,.25);
    box-shadow:0 0 30px rgba(95,243,255,.25),0 0 60px rgba(176,124,255,.2)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes auraPulse{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}

  .intro-title{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,6.4vw,2.25rem);line-height:1.12;margin:6px 0 12px;
    background:linear-gradient(100deg,#c9fbff 0%,#ffffff 35%,#e6d4ff 65%,#ffc9ef 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(140,200,255,.35))}
  .intro-note{font-size:.98rem;line-height:1.7;color:var(--muted);margin:0 4px 22px}
  #enterBtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;font-weight:600;font-size:1.02rem;letter-spacing:.02em;
    color:#061020;background:linear-gradient(100deg,#7ff6ff,#c9b2ff 55%,#ffb7ea);
    box-shadow:0 0 22px rgba(95,243,255,.55),0 0 48px rgba(176,124,255,.35);animation:btnGlow 3s ease-in-out infinite;transition:transform .25s}
  #enterBtn:active{transform:scale(.96)}
  #enterBtn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
  @keyframes btnGlow{0%,100%{box-shadow:0 0 20px rgba(95,243,255,.5),0 0 44px rgba(176,124,255,.3)}50%{box-shadow:0 0 30px rgba(95,243,255,.8),0 0 70px rgba(255,95,210,.4)}}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
  .intro-hint{display:block;margin-top:14px;font-size:.78rem;color:rgba(169,191,217,.7)}

  /* Lotus SVG */
  .lotus .petal{transform-box:view-box;transform-origin:100px 136px;
    animation:lotusBloom 2.8s cubic-bezier(.2,.8,.2,1) var(--dl,0s) both, lotusBreathe 4.6s ease-in-out calc(var(--dl,0s) + 2.8s) infinite alternate}
  @keyframes lotusBloom{0%{transform:rotate(0deg) scale(.5);opacity:0}100%{transform:rotate(var(--a)) scale(1);opacity:1}}
  @keyframes lotusBreathe{0%{transform:rotate(var(--a)) scale(1)}100%{transform:rotate(calc(var(--a) * .88)) scale(.97)}}
  .lotus .l-aura{transform-box:view-box;transform-origin:100px 112px;animation:auraPulse 4s ease-in-out infinite}
  .lotus .l-core{transform-box:view-box;transform-origin:100px 124px;animation:corePulse 2.4s ease-in-out infinite}
  @keyframes corePulse{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.2);opacity:1}}
  .lotus .l-ring{transform-box:view-box;transform-origin:100px 146px;animation:ring 4s ease-out infinite}
  .lotus .l-ring.r2{animation-delay:2s}
  @keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .lotus .orbit{transform-box:view-box;transform-origin:100px 108px;animation:spin 11s linear infinite}
  .lotus .orbit.o2{animation-duration:17s;animation-direction:reverse}
  .lotus .orbit circle{animation:ffBlink 2.6s ease-in-out infinite}
  .lotus .orbit circle:nth-child(2){animation-delay:.7s}.lotus .orbit circle:nth-child(3){animation-delay:1.4s}.lotus .orbit circle:nth-child(4){animation-delay:2s}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ───────────── LOADER ───────────── */
  #loader{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(3,8,18,.6);transition:opacity .8s;font-size:.95rem;color:var(--muted);text-align:center;padding:24px}
  #loader.hidden{opacity:0;pointer-events:none}
  .orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#7ff6ff 30%,rgba(176,124,255,.4) 60%,transparent 72%);
    animation:auraPulse 1.6s ease-in-out infinite;box-shadow:0 0 40px rgba(95,243,255,.6)}

  /* ───────────── HUD ───────────── */
  .glass{background:linear-gradient(160deg,rgba(26,46,86,.5),rgba(8,16,38,.42));
    -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(160,205,255,.16);box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 24px rgba(120,100,255,.12)}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity 1.4s}
  #hud.show{opacity:1}
  .counter{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;padding:9px 15px;border-radius:999px;font-size:.84rem;font-weight:500;letter-spacing:.02em;
    display:flex;align-items:center;gap:8px}
  .counter .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:corePulse 2s ease-in-out infinite}
  .counter.done{color:#ffe6f4;border-color:rgba(255,180,220,.4);box-shadow:0 0 26px rgba(255,120,190,.35)}
  .counter.done .dot{background:#ffb3dd;box-shadow:0 0 10px #ff8fcf}
  .hud-btns{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
  .hbtn{pointer-events:auto;height:40px;min-width:40px;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:.82rem;font-weight:500;transition:transform .2s, box-shadow .3s}
  .hbtn:active{transform:scale(.93)}
  .hbtn svg{width:18px;height:18px;flex:none}
  @media (max-width:420px){ .hbtn .lbl{display:none} .hbtn{padding:0} }

  #toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-10px);z-index:16;
    max-width:min(90vw,420px);padding:11px 18px;border-radius:16px;font-size:.88rem;line-height:1.45;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .8s, transform .8s}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ───────────── TARJETA DE POEMA ───────────── */
  #poemCard{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:17;
    width:min(92vw,440px);max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:22px 22px 18px;border-radius:24px;text-align:center;
    opacity:0;pointer-events:none;transform:translate(-50%,30px) scale(.98);transition:opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
  #poemCard.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
  #poemCard::before{content:'';position:absolute;left:20%;right:20%;top:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 16px var(--accent)}
  .pc-num{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);opacity:.9;margin-bottom:6px}
  .pc-title{font-family:var(--serif);font-weight:600;font-size:clamp(1.45rem,5.4vw,1.8rem);line-height:1.15;margin-bottom:12px;
    color:#fff;text-shadow:0 0 18px var(--accent)}
  .verses span{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(1.08rem,4.3vw,1.22rem);line-height:1.5;color:#e4effc;
    opacity:0;transform:translateY(8px);animation:verseIn .9s ease forwards}
  @keyframes verseIn{to{opacity:1;transform:none}}
  .pc-close{margin-top:16px;padding:10px 20px;border-radius:999px;font-size:.86rem;font-weight:600;
    border:1px solid rgba(200,230,255,.25);background:rgba(255,255,255,.06);box-shadow:0 0 18px rgba(95,243,255,.15)}
  .pc-close:active{transform:scale(.96)}

  /* ───────────── BOTÓN Y CARTA FINAL ───────────── */
  #letterBtn{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:16;
    padding:13px 24px;border-radius:999px;font-weight:600;font-size:.95rem;color:#2a0820;
    background:linear-gradient(100deg,#ffd27a,#ffb3dd 50%,#ff8fcf);box-shadow:0 0 26px rgba(255,140,200,.6),0 0 60px rgba(255,210,122,.35);
    animation:heartBeat 2.2s ease-in-out infinite;transition:opacity .8s}
  #letterBtn.hidden{opacity:0;pointer-events:none}
  @keyframes heartBeat{0%,100%{transform:translateX(-50%) scale(1)}12%{transform:translateX(-50%) scale(1.06)}24%{transform:translateX(-50%) scale(1)}36%{transform:translateX(-50%) scale(1.04)}}
  #letter{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(circle at 50% 40%,rgba(60,20,60,.55),rgba(3,6,16,.86));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity 1.1s}
  #letter.show{opacity:1;pointer-events:auto}
  .letter-card{position:relative;width:min(94vw,520px);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:34px 26px 26px;border-radius:26px;text-align:center;
    background:linear-gradient(170deg,rgba(60,30,70,.62),rgba(18,14,40,.7));border:1px solid rgba(255,190,225,.28);
    box-shadow:0 0 50px rgba(255,120,190,.3),0 0 120px rgba(255,210,122,.15),0 30px 80px rgba(0,0,0,.6);
    transform:translateY(20px) scale(.97);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
  #letter.show .letter-card{transform:none}
  .letter-seal{width:58px;height:58px;margin:-6px auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;
    background:radial-gradient(circle,#ffd8ec,#ff8fcf 60%,#b8457f);color:#fff;box-shadow:0 0 30px rgba(255,140,200,.8);animation:corePulse 2.4s ease-in-out infinite}
  .letter-date-lbl{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:#ffcfe6;opacity:.85}
  .letter-date{font-family:var(--serif);font-size:1.25rem;color:var(--gold);margin:4px 0 10px;text-shadow:0 0 14px rgba(255,210,122,.6)}
  .letter-title{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,7vw,2.5rem);margin-bottom:14px;

<!-- ═══════════════════════════════════════════════════════════════════
     🎶 MOTOR DE AUDIO (Web Audio API, 100% generado por código)
     ═══════════════════════════════════════════════════════════════════ -->
<script>
window.SanctuaryAudio = (function () {
  var A = {};
  var ctx = null, master, music, sfx, reverb, delay, started = false, muted = false;
  var padTimer = null, bellTimer = null, chordIdx = 0, noteIdx = 5, localEl = null, synthOn = false;
  var VOL = 0.85;
  // Escala pentatónica de Re mayor (siempre suena armónica)
  var SCALE = [];
  for (var o = 0; o < 3; o++) [0, 2, 4, 7, 9].forEach(function (s) { SCALE.push(62 + o * 12 + s); });
  // Progresión cálida: Dadd9 – Bm7 – Gmaj7 – Asus
  var CHORDS = [[50, 57, 62, 64, 66, 69], [47, 54, 59, 62, 66], [43, 50, 57, 59, 62, 66], [45, 52, 57, 59, 64, 69]];
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function impulse(sec, decay) {
    var len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  A.init = function () {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    master = ctx.createGain(); master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    master.connect(comp); comp.connect(ctx.destination);

    reverb = ctx.createConvolver(); reverb.buffer = impulse(4.5, 2.6);
    var rg = ctx.createGain(); rg.gain.value = 0.55; reverb.connect(rg); rg.connect(master);

    delay = ctx.createDelay(2); delay.delayTime.value = 0.42;
    var fb = ctx.createGain(); fb.gain.value = 0.36;
    var dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
    delay.connect(dlp); dlp.connect(fb); fb.connect(delay);
    var dg = ctx.createGain(); dg.gain.value = 0.32; dlp.connect(dg); dg.connect(master); dg.connect(reverb);

    music = ctx.createGain(); music.gain.value = 0.9; music.connect(master); music.connect(reverb);
    sfx = ctx.createGain(); sfx.gain.value = 0.85; sfx.connect(master); sfx.connect(reverb); sfx.connect(delay);

    // Desbloqueo iOS: buffer silencioso dentro del gesto del usuario
    var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0);
    if (ctx.state === 'suspended') ctx.resume();
  };

  // ── Pad cálido con filtro paso bajo ──
  function padChord(notes, dur) {
    var t = ctx.currentTime;
    var filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = 0.7;
    filt.frequency.setValueAtTime(350, t);
    filt.frequency.linearRampToValueAtTime(1150, t + dur * 0.55);
    filt.frequency.linearRampToValueAtTime(450, t + dur + 4);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.12, t + 3.5);
    g.gain.setValueAtTime(0.12, t + dur);
    g.gain.linearRampToValueAtTime(0.0001, t + dur + 4);
    filt.connect(g); g.connect(music);
    var per = 1 / notes.length;
    notes.forEach(function (n, i) {
      var layers = i < 3 ? [['sawtooth', -7, 0.28], ['triangle', 6, 0.8]] : [['triangle', 5, 0.7], ['sine', -4, 0.6]];
      layers.forEach(function (L) {
        var o = ctx.createOscillator(); o.type = L[0]; o.frequency.value = mtof(n);
        o.detune.value = L[1] + (Math.random() - 0.5) * 5;
        var og = ctx.createGain(); og.gain.value = L[2] * per;
        o.connect(og); og.connect(filt); o.start(t); o.stop(t + dur + 4.3);
      });
    });
  }

  // ── Campanita de piano cristalino ──
  function bell(m, vel, when) {
    var t = ctx.currentTime + (when || 0), f = mtof(m);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    g.connect(sfx);
    [[1, 1], [2, 0.28], [3.01, 0.09], [4.2, 0.045]].forEach(function (h) {
      var o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * h[0];
      var og = ctx.createGain(); og.gain.value = h[1]; o.connect(og); og.connect(g);
      o.start(t); o.stop(t + 3.7);
    });
  }

  // ── Arpa pulsada ──
  function pluck(m, vel, when) {
    var t = ctx.currentTime + (when || 0), f = mtof(m);
    var filt = ctx.createBiquadFilter(); filt.type = 'lowpass';
    filt.frequency.setValueAtTime(5200, t); filt.frequency.exponentialRampToValueAtTime(900, t + 1.6);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.9);
    filt.connect(g); g.connect(sfx);
    [['triangle', 1, 1], ['sine', 2, 0.35], ['sine', 3, 0.1]].forEach(function (h) {
      var o = ctx.createOscillator(); o.type = h[0]; o.frequency.value = f * h[1];
      var og = ctx.createGain(); og.gain.value = h[2]; o.connect(og); og.connect(filt);
      o.start(t); o.stop(t + 3);
    });
  }

  function breeze() {
    var len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0), last = 0;
    for (var i = 0; i < len; i++) { last = last * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = last * 6; }
    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.6;
    var g = ctx.createGain(); g.gain.value = 0.03;
    var l1 = ctx.createOscillator(); l1.frequency.value = 0.06; var l1g = ctx.createGain(); l1g.gain.value = 260; l1.connect(l1g); l1g.connect(bp.frequency);
    var l2 = ctx.createOscillator(); l2.frequency.value = 0.045; var l2g = ctx.createGain(); l2g.gain.value = 0.018; l2.connect(l2g); l2g.connect(g.gain);
    src.connect(bp); bp.connect(g); g.connect(music);
    src.start(); l1.start(); l2.start();
  }

  function startSynth() {
    if (synthOn || !ctx) return; synthOn = true;
    padChord(CHORDS[0], 9); chordIdx = 1;
    padTimer = setInterval(function () { if (ctx.state === 'running') { padChord(CHORDS[chordIdx % CHORDS.length], 9); chordIdx++; } }, 9000);
    (function sparkle() {
      bellTimer = setTimeout(function () {
        if (ctx.state === 'running') bell(SCALE[5 + Math.floor(Math.random() * 10)], 0.022 + Math.random() * 0.018);
        sparkle();
      }, 1800 + Math.random() * 3200);
    })();
    breeze();
  }

  A.start = function () {
    if (!ctx || started) return; started = true;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(muted ? 0 : VOL, ctx.currentTime + 3);
    var url = (window.CONFIG && window.CONFIG.MUSICA_LOCAL_URL || '').trim();
    if (url) {
      // 🎵 Opción de música local (./musica.mp3 en la misma carpeta)
      localEl = new Audio(url); localEl.loop = true; localEl.preload = 'auto';
      try { var srcNode = ctx.createMediaElementSource(localEl); srcNode.connect(music); } catch (e) {}
      localEl.addEventListener('error', startSynth);
      var p = localEl.play(); if (p && p.catch) p.catch(startSynth);
      // Sin el pad, mantenemos la brisa y las campanitas suaves:
    } else {
      startSynth();
    }
  };

  A.harp = function () {
    if (!ctx) return;
    var steps = [-2, -1, 1, 2, 1, -1, 3, -3];
    noteIdx = Math.max(0, Math.min(SCALE.length - 1, noteIdx + steps[Math.floor(Math.random() * steps.length)]));
    pluck(SCALE[noteIdx], 0.12);
  };
  A.softHarp = function () { if (!ctx) return; pluck(SCALE[3 + Math.floor(Math.random() * 9)], 0.06); };
  A.arpeggio = function () {
    if (!ctx) return;
    var s = Math.floor(Math.random() * 4), seq = [0, 1, 2, 3, 5, 7];
    seq.forEach(function (k, i) { pluck(SCALE[Math.min(SCALE.length - 1, s + k)], 0.11, i * 0.13); });
    bell(SCALE[Math.min(SCALE.length - 1, s + 9)], 0.05, 0.85);
  };
  A.finale = function () {
    if (!ctx) return;
    for (var i = 0; i < SCALE.length; i++) pluck(SCALE[i], 0.09, i * 0.09);
    [0, 2, 4].forEach(function (k, i) { bell(SCALE[10 + k], 0.06, 1.5 + i * 0.25); });
    padChord([50, 57, 62, 66, 69, 74], 10);
  };
  A.heart = function () {
    if (!ctx) return;
    [0, 2, 4, 5, 7, 9].forEach(function (k, i) { bell(SCALE[3 + k], 0.06, i * 0.16); });
  };
  A.setMuted = function (m) {
    muted = m;
    if (localEl) localEl.muted = m;
    if (!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(m ? 0 : VOL, ctx.currentTime, 0.25);
  };
  A.isMuted = function () { return muted; };

  document.addEventListener('visibilitychange', function () {
    if (!ctx || !started) return;
    if (document.hidden) { ctx.suspend(); if (localEl) localEl.pause(); }
    else { ctx.resume(); if (localEl && !muted) localEl.play().catch(function () {}); }
  });
  return A;
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     🌙 INTRO, CARGA Y BOTÓN DE SONIDO
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var C = window.CONFIG, $ = function (id) { return document.getElementById(id); };
  $('introTitle').textContent = C.TITULO_INTRO;
  $('introNote').textContent = C.NOTA_INTRO;
  $('enterLabel').textContent = C.TEXTO_BOTON;

  // Imagen de la intro: SVG por defecto, o imagen local con respaldo onerror
  var vis = $('introVisual'), svgHTML = vis.innerHTML, url = (C.IMAGEN_INTRO_URL || '').trim();
  if (url) {
    var img = new Image(); img.alt = ''; img.decoding = 'async';
    img.onload = function () { vis.innerHTML = ''; vis.appendChild(img); };
    img.onerror = function () { vis.innerHTML = svgHTML; };
    img.src = url;
  }

  // Luciérnagas de fondo
  var layer = $('introFireflies');
  for (var i = 0; i < 34; i++) {
    var f = document.createElement('span');
    f.className = 'ff' + (Math.random() < 0.3 ? ' c' : '');
    f.style.left = (Math.random() * 100) + '%';
    f.style.top = (Math.random() * 100) + '%';
    f.style.setProperty('--x', ((Math.random() - 0.5) * 140) + 'px');
    f.style.setProperty('--y', ((Math.random() - 0.5) * 140) + 'px');
    f.style.setProperty('--d', (6 + Math.random() * 10) + 's');
    f.style.setProperty('--b', (2 + Math.random() * 4) + 's');
    f.style.animationDelay = (-Math.random() * 10) + 's, ' + (-Math.random() * 5) + 's';
    var s = 2 + Math.random() * 3; f.style.width = f.style.height = s + 'px';
    layer.appendChild(f);
  }

  var entered = false;
  $('enterBtn').addEventListener('click', function () {
    if (entered) return; entered = true;
    try { window.SanctuaryAudio.init(); window.SanctuaryAudio.start(); } catch (e) { console.warn(e); }
    $('intro').classList.add('leaving');
    setTimeout(function () { $('intro').style.display = 'none'; }, 1400);
    var go = function () { $('loader').classList.add('hidden'); window.__santuario.start(); };
    if (window.__santuario && window.__santuario.ready) { setTimeout(go, 500); }
    else {
      $('loader').classList.remove('hidden');
      window.addEventListener('santuario-ready', go, { once: true });
      setTimeout(function () {
        if (!(window.__santuario && window.__santuario.ready))
          $('loaderText').textContent = 'La magia está tardando un poquito… revisa tu conexión y recarga la página 💫';
      }, 25000);
    }
  });
  window.addEventListener('santuario-error', function () {
    $('loaderText').textContent = window.__santuarioError || 'No se pudo encender el santuario en este navegador.';
  });

  $('btnSound').addEventListener('click', function () {
    var m = !window.SanctuaryAudio.isMuted();
    window.SanctuaryAudio.setMuted(m);
    $('icoSoundOn').classList.toggle('hidden', m);
    $('icoSoundOff').classList.toggle('hidden', !m);
  });
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     🌳 EL SANTUARIO 3D (Three.js)

<script type="module">
import * as THREE from 'three';

const CONFIG = window.CONFIG;

// ─────────── Utilidades ───────────
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20241114);
const lerp = THREE.MathUtils.lerp;
const clamp = THREE.MathUtils.clamp;
const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (p) => { if (p <= 0) return 0; if (p >= 1) return 1; const c = 1.35; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

async function loadAddons() {
  const out = {};
  try { out.OrbitControls = (await import('three/addons/controls/OrbitControls.js')).OrbitControls; } catch (e) { console.warn('OrbitControls no disponible', e); }
  try { out.Reflector = (await import('three/addons/objects/Reflector.js')).Reflector; } catch (e) { console.warn('Reflector no disponible', e); }
  try {
    const [ec, rp, ub, op] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js')
    ]);
    out.EffectComposer = ec.EffectComposer; out.RenderPass = rp.RenderPass; out.UnrealBloomPass = ub.UnrealBloomPass; out.OutputPass = op.OutputPass;
  } catch (e) { console.warn('Post-procesado no disponible, se usará render directo', e); }
  return out;
}

// ─────────── Shaders compartidos ───────────
const GLOW_FRAG = /* glsl */`
  varying vec3 vC; varying float vA;
  void main(){
    vec2 c = gl_PointCoord - 0.5; float d = length(c);
    if (d > 0.5) discard;
    float core = smoothstep(0.2, 0.0, d);
    float halo = smoothstep(0.5, 0.0, d);
    float a = (core * 0.9 + halo * halo * 0.55) * vA;
    gl_FragColor = vec4(vC * (0.55 + core), a);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

const PALETTE_HEX = ['#3ff6ff', '#ff4fd8', '#ffc85a', '#b48cff', '#3fffc8'];
const PALETTE = PALETTE_HEX.map((h) => new THREE.Color(h));

async function main() {

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));

  // ─────────── Cielo nocturno ───────────
  const sky = new THREE.Mesh(new THREE.SphereGeometry(420, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, uniforms: { uTime: U.time },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: /* glsl */`
      varying vec3 vDir; uniform float uTime;
      float hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float noise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);
        return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x), mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x), mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y), f.z); }
      float fbm(vec3 p){ float v=0.0, a=0.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 zen = vec3(0.003,0.006,0.026), hor = vec3(0.028,0.05,0.14);
        vec3 col = mix(hor, zen, smoothstep(-0.05, 0.65, h));
        float band = exp(-pow((d.y*0.9 - d.x*0.42 + 0.05)*2.6, 2.0));
        float n = fbm(d*3.2 + vec3(0.0,0.0,uTime*0.004));
        col += band * n * vec3(0.12,0.04,0.2) + band * fbm(d*7.0) * vec3(0.0,0.07,0.1) * 0.7;

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
  sky.renderOrder = -10;
  scene.add(sky);

  // ─────────── Estrellas ───────────
  {
    const N = Math.floor(2600 * Q);
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N), seed = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const u = rand(), v = rand() * 0.98 + 0.02, th = u * Math.PI * 2, y = v, r = Math.sqrt(1 - y * y);
      pos.set([Math.cos(th) * r * 390, y * 390, Math.sin(th) * r * 390], i * 3);
      const c = new THREE.Color().setHSL(0.55 + rand() * 0.2, 0.5, 0.75 + rand() * 0.25).multiplyScalar(0.6 + rand() * 0.9);
      col.set([c.r, c.g, c.b], i * 3);

    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: U.time, uPR: U.pr },
      vertexShader: `attribute vec3 aColor; attribute float aSize; attribute float aSeed; uniform float uTime, uPR; varying vec3 vC; varying float vA;
        void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mv;
          float tw = 0.55 + 0.45 * sin(uTime*(0.6 + aSeed*2.4) + aSeed*40.0);
          gl_PointSize = aSize * uPR * (0.75 + 0.25*tw); vC = aColor; vA = tw; }`,

    const stars = new THREE.Points(g, m); stars.renderOrder = -9; stars.frustumCulled = false;

  // ─────────── Montañas 360° ───────────
  function mountainRing(radius, base, amp, seed, top, bottom, rim) {
    const seg = 220, r = mulberry32(seed);
    const ph = Array.from({ length: 5 }, () => r() * 6.28);
    const pos = [], col = [], idx = [], line = [];
    const cTop = new THREE.Color(top), cBot = new THREE.Color(bottom);
    for (let i = 0; i <= seg; i++) {
      const a = i / seg * Math.PI * 2;
      const h = base + amp * (0.5 * Math.sin(a * 3 + ph[0]) + 0.3 * Math.sin(a * 7 + ph[1]) + 0.18 * Math.sin(a * 13 + ph[2]) + 0.1 * Math.sin(a * 29 + ph[3]) + 0.05 * Math.sin(a * 53 + ph[4]));
      const x = Math.cos(a) * radius, z = Math.sin(a) * radius;
      pos.push(x, -2, z, x, h, z);
      col.push(cBot.r, cBot.g, cBot.b, cTop.r, cTop.g, cTop.b);
      line.push(x, h + 0.05, z);
      if (i < seg) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: true }));
    scene.add(mesh);
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(line, 3));
    scene.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: rim, transparent: true, opacity: 0.7, fog: true })));
  }
  mountainRing(165, 22, 30, 3, 0x14113a, 0x03050d, 0x5a3fae);
  mountainRing(120, 9, 14, 9, 0x0b1a34, 0x02040a, 0x2a8fb0);

  // ─────────── Agua reflectante con ondas ───────────
  const RIPPLES = 12;
  const WATER_VERT = /* glsl */`
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;
    void main(){ vUv = textureMatrix * vec4(position,1.0); vec4 wp = modelMatrix * vec4(position,1.0); vWorld = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`;
  const WATER_FRAG = /* glsl */`
    uniform vec3 color; uniform sampler2D tDiffuse; uniform float uTime; uniform vec4 uRipples[${RIPPLES}];
    uniform vec3 uGlowCol; uniform float uGlow; uniform vec3 uFogCol;
    varying vec4 vUv; varying vec3 vWorld;
    void main(){
      vec2 p = vWorld.xz; float dist = length(p);
      float ring = 0.0; vec2 disp = vec2(0.0);
      for (int i = 0; i < ${RIPPLES}; i++){
        vec4 r = uRipples[i]; float age = uTime - r.z;
        if (age > 0.0 && age < r.w){
          float rad = age * 3.2; vec2 dv = p - r.xy; float d = length(dv); float x = d - rad;
          float fade = 1.0 - age / r.w; fade *= fade;
          float w = exp(-x*x*2.4) * fade;
          float w2 = exp(-pow(d - rad*0.62, 2.0)*3.0) * fade * 0.5;
          ring += w + w2;
          disp += dv / (d + 0.001) * w * sin(x*6.0);
        }

      disp += vec2(sin(p.x*0.35 + uTime*0.6) + 0.6*sin(p.y*0.5 - uTime*0.45), cos(p.y*0.4 + uTime*0.5) + 0.6*cos(p.x*0.6 + uTime*0.35)) * 0.12;
      vec3 col = vec3(0.004, 0.012, 0.03);
      #ifdef USE_REFL
        vec4 uv = vUv; uv.xy += disp * 0.014 * uv.w;
        vec3 refl = texture2DProj(tDiffuse, uv).rgb;
        col += refl * color * (0.45 + 0.55 * smoothstep(0.0, 1.2, max(refl.r, max(refl.g, refl.b))));
      #endif
      col += uGlowCol * uGlow * exp(-dist*0.11) * 0.32;
      col += min(ring, 1.5) * vec3(0.25, 0.75, 1.0) * 0.5;
      col = mix(col, uFogCol, (1.0 - exp(-dist*0.0125)) * 0.85);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`;
  const waterUniforms = {
    color: { value: new THREE.Color(0x8fa6d6) }, tDiffuse: { value: null }, textureMatrix: { value: new THREE.Matrix4() },
    uTime: { value: 0 }, uRipples: { value: Array.from({ length: RIPPLES }, () => new THREE.Vector4(0, 0, -100, 1)) },
    uGlowCol: { value: new THREE.Color(0x6a7dff) }, uGlow: { value: 1 }, uFogCol: { value: FOG_COL.clone() }
  };
  const waterGeo = new THREE.CircleGeometry(230, 96);
  let water = null;
  if (AD.Reflector) {
    try {
      const s = isMobile ? 0.4 : 0.6, pr = renderer.getPixelRatio();
      water = new AD.Reflector(waterGeo, {

        textureWidth: Math.floor(innerWidth * pr * s), textureHeight: Math.floor(innerHeight * pr * s),

      });
    } catch (e) { console.warn('Reflector falló', e); water = null; }
  }
  if (!water) water = new THREE.Mesh(waterGeo, new THREE.ShaderMaterial({ uniforms: waterUniforms, vertexShader: WATER_VERT, fragmentShader: WATER_FRAG }));
  water.rotation.x = -Math.PI / 2;
  scene.add(water);
  const WU = water.material.uniforms;
  let rippleIdx = 0;
  function addRipple(x, z, dur = 4.5) { WU.uRipples.value[rippleIdx].set(x, z, U.time.value, dur); rippleIdx = (rippleIdx + 1) % RIPPLES; }

  // ─────────── Luces ───────────
  scene.add(new THREE.AmbientLight(0x1a2650, 1.1));
  const moon = new THREE.DirectionalLight(0x7f95ff, 0.5); moon.position.set(-30, 60, -20); scene.add(moon);
  const treeLight = new THREE.PointLight(0x8a7dff, 90, 45, 2); treeLight.position.set(0, 10, 0); scene.add(treeLight);
  const TREE_LIGHT_A = new THREE.Color(0x8a7dff), TREE_LIGHT_B = new THREE.Color(0xff8fc0);

  // ─────────── Isla y musgo ───────────
  const mossMat = new THREE.MeshStandardMaterial({ color: 0x07161a, roughness: 1, emissive: 0xffffff, emissiveMap: mossTex, emissiveIntensity: 0.75 });
  const island = new THREE.Mesh(new THREE.SphereGeometry(5.6, 48, 20), mossMat);
  island.scale.set(1, 0.3, 1); island.position.y = -0.15; scene.add(island);
  // piedras con musgo alrededor de la isla
  const stoneGeo = new THREE.IcosahedronGeometry(1, 1);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2 + rand() * 0.4, r = 5.4 + rand() * 1.2;
    const st = new THREE.Mesh(stoneGeo, mossMat);
    st.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); st.scale.set(0.5 + rand() * 0.6, 0.25 + rand() * 0.3, 0.5 + rand() * 0.6);
    st.rotation.y = rand() * 6; scene.add(st);
  }

  // ─────────── Árbol de la Vida (procedural) ───────────
  const treeGeos = [], tips = [];
  function taperTube(curve, r0, r1, seg, rseg) {
    const g = new THREE.TubeGeometry(curve, seg, 1, rseg, false);
    const pos = g.attributes.position, nor = g.attributes.normal;
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, c = curve.getPointAt(t), base = lerp(r0, r1, Math.pow(t, 0.8));
      for (let j = 0; j <= rseg; j++) {
        const k = i * (rseg + 1) + j;
        const r = base * (1 + 0.07 * Math.sin(j / rseg * Math.PI * 2 * 5 + t * 3));
        pos.setXYZ(k, c.x + nor.getX(k) * r, c.y + nor.getY(k) * r, c.z + nor.getZ(k) * r);
      }
    }
    return g;
  }
  function grow(start, dir, len, r0, depth) {
    const pts = [start.clone()]; let p = start.clone(); const d = dir.clone(); const n = 5;
    for (let i = 1; i <= n; i++) {
      d.x += (rand() - 0.5) * 0.36; d.z += (rand() - 0.5) * 0.36; d.y += 0.05; d.normalize();
      p = p.clone().addScaledVector(d, len / n); pts.push(p);
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const r1 = depth === 0 ? r0 * 0.3 : r0 * 0.62;
    treeGeos.push(taperTube(curve, r0, r1, 6 + depth * 4, depth >= 3 ? 12 : 7));
    if (depth === 0) { tips.push(p.clone()); return; }
    const kids = depth >= 4 ? 3 : (rand() < 0.55 ? 2 : 3);
    const base = rand() * Math.PI * 2;
    for (let k = 0; k < kids; k++) {
      const t = k === 0 ? 0.999 : 0.45 + rand() * 0.45;
      const sp = curve.getPointAt(t);
      const ang = base + k * (Math.PI * 2 / kids) + (rand() - 0.5) * 0.6;
      const spread = 0.5 + rand() * 0.4 + (4 - depth) * 0.12;
      const nd = d.clone().multiplyScalar(k === 0 ? 0.9 : 0.45).add(new THREE.Vector3(Math.cos(ang) * spread, 0.32, Math.sin(ang) * spread)).normalize();
      grow(sp, nd, len * 0.7, lerp(r0, r1, t) * 0.8, depth - 1);
    }
  }
  grow(new THREE.Vector3(0, 0.8, 0), new THREE.Vector3(0, 1, 0), 6.6, 0.95, 4);
  for (let k = 0; k < 7; k++) { // raíces
    const a = k / 7 * Math.PI * 2 + rand() * 0.4, r = 4 + rand() * 1.2;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 2.0, 0), new THREE.Vector3(Math.cos(a) * 1.3, 1.45, Math.sin(a) * 1.3),
      new THREE.Vector3(Math.cos(a) * r * 0.65, 0.9, Math.sin(a) * r * 0.65), new THREE.Vector3(Math.cos(a + 0.2) * r, 0.1, Math.sin(a + 0.2) * r)]);
    treeGeos.push(taperTube(curve, 0.5, 0.07, 16, 7));
  }

  const heartHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xff7fbf, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
  heartHalo.scale.setScalar(4.2); heart.add(heartHalo);
  const heartHit = new THREE.Mesh(hitGeo, hitMat); heartHit.scale.setScalar(1.9); heart.add(heartHit);
  heartHit.userData.heart = true;
  let heartScale = 0;

  // ─────────── Post-procesado (con respaldo) ───────────
  let composer = null, bloom = null;
  if (AD.EffectComposer) {
    try {
      composer = new AD.EffectComposer(renderer);
      composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.25 : 1.75));
      composer.setSize(innerWidth, innerHeight);
      composer.addPass(new AD.RenderPass(scene, camera));
      const bs = isMobile ? 0.5 : 1;
      bloom = new AD.UnrealBloomPass(new THREE.Vector2(innerWidth * bs, innerHeight * bs), 1.0, 0.6, 0.2);
      composer.addPass(bloom);
      composer.addPass(new AD.OutputPass());
    } catch (e) { console.warn('Bloom desactivado', e); composer = null; }
  }
  function render() {
    if (composer) {
      try { composer.render(); return; } catch (e) { console.warn('Bloom falló, render directo', e); composer = null; }
    }
    renderer.render(scene, camera);
  }

  // ─────────── Controles ───────────
  const fallbackTarget = HOME_TARGET.clone();
  let controls = null;
  if (AD.OrbitControls) {
    controls = new AD.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 2.5; controls.maxDistance = 70;
    controls.minPolarAngle = 0.15; controls.maxPolarAngle = Math.PI * 0.55;
    controls.rotateSpeed = isMobile ? 0.55 : 0.6; controls.zoomSpeed = 0.8;
    controls.autoRotate = false; controls.autoRotateSpeed = 0.35;
    controls.enabled = false;
    controls.target.copy(HOME_TARGET);
  }
  const tgt = controls ? controls.target : fallbackTarget;

  let resumeTimer = null, cardOpen = false, letterOpen = false;
  function scheduleAutoRotate(ms = 4000) {
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => { if (controls && !cardOpen && !letterOpen && !camTween) controls.autoRotate = true; }, ms);
  }
  if (controls) {
    controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeTimer); });
    controls.addEventListener('end', () => scheduleAutoRotate(4000));
  }

  // ─────────── Tweens de cámara ───────────
  const tweens = [];
  let camTween = null;
  function tween(dur, onUpdate, ease = easeInOutCubic, onDone) {
    const tw = { start: performance.now() / 1000, dur, onUpdate, ease, onDone }; tweens.push(tw); return tw;
  }
  function updateTweens() {
    const now = performance.now() / 1000;
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i]; const p = Math.min(1, (now - tw.start) / tw.dur);
      tw.onUpdate(tw.ease(p), p);
      if (p >= 1) { tweens.splice(i, 1); if (tw.onDone) tw.onDone(); }
    }
  }
  function cancelCam() { if (camTween) { const k = tweens.indexOf(camTween); if (k >= 0) tweens.splice(k, 1); camTween = null; } }
  function flyTo(pos, target, dur = 1.8, done) {
    cancelCam();
    const p0 = camera.position.clone(), t0 = tgt.clone();
    const arc = Math.min(3, p0.distanceTo(pos) * 0.12);
    if (controls) { controls.enabled = false; controls.autoRotate = false; }
    camTween = tween(dur, (e) => {
      camera.position.lerpVectors(p0, pos, e); camera.position.y += Math.sin(e * Math.PI) * arc;
      tgt.lerpVectors(t0, target, e); camera.lookAt(tgt);
    }, easeInOutCubic, () => {
      camTween = null;
      if (controls) { controls.enabled = true; controls.update(); }
      if (done) done();
    });
  }
  function homePose(dist = homeDist(), h = HOME_H) {
    const off = camera.position.clone().sub(tgt); off.y = 0;
    if (off.lengthSq() < 0.01) off.set(0, 0, 1);
    off.normalize().multiplyScalar(dist);
    return new THREE.Vector3(off.x, h, off.z);
  }
  function goHome() {
    hidePoem();
    flyTo(homePose(), HOME_TARGET, 2.2, () => scheduleAutoRotate(2500));
  }

  // ─────────── UI ───────────
  let openedCount = 0, climaxStarted = false;
  const climax = { value: 0 };
  function updateCounter() {
    const el = $('counter');
    if (openedCount >= 12) { $('counterText').textContent = 'Santuario completo ✨'; el.classList.add('done'); }
    else $('counterText').textContent = `Flores abiertas: ${openedCount} / 12`;
  }
  let toastTimer = null;
  function toast(msg, ms = 5000) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }
  function showPoem(f) {
    const card = $('poemCard');
    card.style.setProperty('--accent', f.cssColor);
    $('pcNum').textContent = `Flor ${f.i + 1} de 12`;
    $('pcTitle').textContent = f.cfg.titulo;
    const v = $('pcVerses'); v.innerHTML = '';
    (f.cfg.poema || []).forEach((line, i) => {
      const s = document.createElement('span'); s.textContent = line; s.style.animationDelay = (0.25 + i * 0.22) + 's'; v.appendChild(s);
    });
    card.scrollTop = 0;
    card.classList.add('show'); cardOpen = true;
  }
  function hidePoem() {
    if (!cardOpen) return;
    $('poemCard').classList.remove('show'); cardOpen = false;
    maybeClimax();
  }
  $('pcClose').addEventListener('click', () => { hidePoem(); scheduleAutoRotate(3000); });
  $('btnOverview').addEventListener('click', () => { if (started) goHome(); });

  function openLetter() {
    const L = CONFIG.CARTA_FINAL;
    $('letterDateLbl').textContent = L.etiquetaFecha || '';
    $('letterDate').textContent = L.fecha || '';
    $('letterTitle').textContent = L.titulo || '';
    $('letterGreet').textContent = L.saludo || '';
    const b = $('letterBody'); b.innerHTML = '';
    (L.mensaje || []).forEach((t) => { const p = document.createElement('p'); p.textContent = t; b.appendChild(p); });
    $('letterSign').textContent = L.firma || '';
    hidePoem();
    $('letter').classList.add('show'); letterOpen = true;
    if (controls) controls.autoRotate = false;
  }
  $('letterClose').addEventListener('click', () => { $('letter').classList.remove('show'); letterOpen = false; scheduleAutoRotate(2500); });
  $('letterBtn').addEventListener('click', () => { SFX.heart(); openLetter(); });

  // ─────────── Interacción: flores ───────────
  const tmpV = new THREE.Vector3();
  function focusFlower(f) {
    const hp = f.head.getWorldPosition(new THREE.Vector3());
    const inward = new THREE.Vector3(-hp.x, 0, -hp.z).normalize();
    const side = new THREE.Vector3(-inward.z, 0, inward.x).multiplyScalar(0.9);
    const camPos = hp.clone().addScaledVector(inward, 4.2).add(side).add(new THREE.Vector3(0, 0.9, 0));
    const target = hp.clone().add(new THREE.Vector3(0, portrait() ? -0.8 : -0.45, 0));
    flyTo(camPos, target, 1.8);
  }
  function pollen(f) {
    const hp = f.head.getWorldPosition(new THREE.Vector3());
    const em = { t: 0, dur: 1.8, acc: 0, update(dt) {
      this.t += dt; this.acc += dt * 70 * (isMobile ? 0.7 : 1);
      while (this.acc >= 1) {
        this.acc -= 1;
        const a = this.t * 9 + Math.random() * 0.4, r = 0.25 + this.t * 0.35;
        const c = Math.random() < 0.55 ? f.color.clone().multiplyScalar(2.4) : C_GOLD;
        sparks.spawn(hp.x + Math.cos(a) * r, hp.y + 0.25, hp.z + Math.sin(a) * r,
          -Math.sin(a) * 1.3, 2.0 + Math.random() * 1.2, Math.cos(a) * 1.3, c, 0.22 + Math.random() * 0.25, 3 + Math.random() * 1.5, 0.12, 0.985, 0.5);
      }
      return this.t < this.dur;
    } };
    emitters.push(em);
  }
  function onFlowerTap(f) {
    SFX.arpeggio();
    focusFlower(f);
    const hp = f.head.getWorldPosition(new THREE.Vector3());
    burst(hp, f.color.clone().multiplyScalar(2.2), 24, 1.6);
    if (!f.opened) {
      f.opened = true; f.openStart = U.time.value + 1.0;
      openedCount++; updateCounter();
      setTimeout(() => pollen(f), 1000);
      if (openedCount === 12) setTimeout(() => { if (!climaxStarted && !cardOpen) maybeClimax(); }, 30000);
      setTimeout(() => showPoem(f), 2100);
    } else {
      setTimeout(() => showPoem(f), 1300);
    }
  }

  // ─────────── Clímax ───────────
  function maybeClimax() {
    if (climaxStarted || openedCount < 12) return;
    climaxStarted = true;
    setTimeout(startClimax, 600);
  }
  function startClimax() {
    SFX.finale();
    flyTo(homePose(homeDist() + 6, 10), HOME_TARGET, 2.6);
    toast('✨ ✨ ✨', 2500);
    const glow0 = canopyMat.uniforms.uGlow.value;
    tween(6, (e) => {
      climax.value = e;
      canopyMat.uniforms.uClimax.value = e; fallMat.uniforms.uClimax.value = e;
      canopyMat.uniforms.uGlow.value = lerp(glow0, 1.35, e); fallMat.uniforms.uGlow.value = lerp(0.9, 1.4, e);
      barkMat.emissive.copy(BARK_A).lerp(BARK_B, e); barkMat.emissiveIntensity = lerp(1.25, 1.7, e);
      treeLight.color.copy(TREE_LIGHT_A).lerp(TREE_LIGHT_B, e); treeLight.intensity = lerp(90, 160, e);
      WU.uGlowCol.value.copy(TREE_LIGHT_A).lerp(TREE_LIGHT_B, e); WU.uGlow.value = lerp(1, 1.35, e);
    }, (t) => t);
    // lluvia masiva de pétalos brillantes
    emitters.push({ t: 0, dur: 16, acc: 0, update(dt) {
      this.t += dt; this.acc += dt * (isMobile ? 55 : 95);
      while (this.acc >= 1) {
        this.acc -= 1;
        const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 13;
        const c = Math.random() < 0.5 ? C_PINK : (Math.random() < 0.6 ? C_GOLD : C_WHITE);
        sparks.spawn(Math.cos(a) * r, 13 + Math.random() * 7, Math.sin(a) * r, (Math.random() - 0.5) * 0.6, -1.2 - Math.random(), (Math.random() - 0.5) * 0.6,
          c, 0.25 + Math.random() * 0.35, 9, -0.05, 0.995, 0.9);
      }
      return this.t < this.dur;
    } });
    setTimeout(() => {
      heart.visible = true; hitboxes.push(heartHit);
      tween(2.4, (e) => { heartScale = easeOutBack(e); }, (t) => t);
      toast(CONFIG.PISTA_CLIMAX, 8000);
      burst(new THREE.Vector3(0, 4, 0), C_PINK, 60, 2.5);
    }, 4200);
    setTimeout(() => $('letterBtn').classList.remove('hidden'), 11000);
  }

  // ─────────── Puntero: estela, toques ───────────
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  let down = null, lastTrail = { x: 0, y: 0 }, lastHarp = 0, waterHintShown = false, started = false;
  const el = renderer.domElement;
  function setNDC(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); raycaster.setFromCamera(ndc, camera); }

  el.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; }, { passive: true });
  el.addEventListener('pointermove', (e) => {
    if (!started) return;
    const dx = e.clientX - lastTrail.x, dy = e.clientY - lastTrail.y;
    if (dx * dx + dy * dy < 36) return;
    lastTrail = { x: e.clientX, y: e.clientY };
    setNDC(e);
    const dist = cardOpen ? 3 : 5.5;
    const p = raycaster.ray.at(dist, tmpV);
    for (let i = 0; i < (isMobile ? 3 : 2); i++) {
      const c = Math.random() < 0.5 ? C_GOLD : C_CYAN;
      sparks.spawn(p.x + (Math.random() - 0.5) * 0.15, p.y + (Math.random() - 0.5) * 0.15, p.z + (Math.random() - 0.5) * 0.15,
        (Math.random() - 0.5) * 0.5, 0.2 + Math.random() * 0.5, (Math.random() - 0.5) * 0.5, c, 0.12 + Math.random() * 0.16, 1.2 + Math.random() * 1.0, 0.35, 0.96, 1.2);
    }
    const now = performance.now();
    if (down && now - lastHarp > 260) { lastHarp = now; SFX.softHarp(); }
    if (!isMobile && !down) { el.style.cursor = raycaster.intersectObjects(hitboxes, false).length ? 'pointer' : 'grab'; }
  }, { passive: true });
  el.addEventListener('pointerup', (e) => {
    if (!down || !started) { down = null; return; }
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
    down = null;
    if (moved > (isMobile ? 16 : 10) || dt > 600 || camTween || letterOpen) return;
    setNDC(e);
    const hits = raycaster.intersectObjects(hitboxes, false);
    if (hits.length) {
      const o = hits[0].object;
      if (o.userData.heart) {
        SFX.heart(); burst(heart.position, C_PINK, 50, 2.2);
        const hp = heart.position.clone(), dir = camera.position.clone().sub(hp).setY(0).normalize();
        flyTo(hp.clone().addScaledVector(dir, 6).add(new THREE.Vector3(0, 1.2, 0)), hp, 1.6, openLetter);
        return;
      }
      if (o.userData.flower) { onFlowerTap(o.userData.flower); return; }
    }
    const wp = raycaster.ray.intersectPlane(waterPlane, new THREE.Vector3());
    if (wp) {
      const d = Math.hypot(wp.x, wp.z);
      if (d > 6.2 && d < 110) {
        addRipple(wp.x, wp.z, 5); spawnLily(wp.x, wp.z); SFX.harp();
        for (let i = 0; i < 22; i++) {
          const a = Math.random() * 6.28, s = 0.6 + Math.random() * 1.4;
          sparks.spawn(wp.x, 0.1, wp.z, Math.cos(a) * s, 1 + Math.random() * 2, Math.sin(a) * s, Math.random() < 0.5 ? C_CYAN : C_GOLD, 0.18 + Math.random() * 0.2, 1.6 + Math.random(), 0.2, 0.96, 0.5);
        }
      }
    }
  }, { passive: true });
  el.addEventListener('pointercancel', () => { down = null; }, { passive: true });

  // ─────────── Resize ───────────
  function onResize() {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) { composer.setSize(innerWidth, innerHeight); }
  }
  addEventListener('resize', onResize);
  addEventListener('orientationchange', () => setTimeout(onResize, 300));

  // ─────────── Bucle principal ───────────
  let last = performance.now() / 1000, perfN = 0, perfAcc = 0, perfDone = false, introDone = false;
  const sway = new THREE.Vector3();
  function loop() {
    requestAnimationFrame(loop);
    const now = performance.now() / 1000; const raw = now - last; const dt = Math.min(0.05, raw); last = now;
    const t = (U.time.value += dt);
    WU.uTime.value = t;
    canopyMat.uniforms.uGlow.value = climaxStarted ? canopyMat.uniforms.uGlow.value : 0.8 + 0.35 * openedCount / 12;

    updateTweens();
    updateFlowers(dt, t);
    updateFall(dt, t);
    updateLilies(t);
    for (let i = emitters.length - 1; i >= 0; i--) if (!emitters[i].update(dt)) emitters.splice(i, 1);
    sparks.update(dt, t);

    if (heart.visible) {
      const dir = camera.position.clone().setY(0); if (dir.lengthSq() < 0.01) dir.set(0, 0, 1); dir.normalize();
      heart.position.set(dir.x * 1.25, 3.6 + Math.sin(t * 1.3) * 0.12, dir.z * 1.25);
      heart.lookAt(camera.position);
      const beat = 1 + 0.08 * Math.pow(Math.max(0, Math.sin(t * 3.2)), 8);
      heart.scale.setScalar(Math.max(0.001, heartScale * beat));
    }

    if (controls && !camTween && controls.enabled) controls.update(dt);
    if (!controls && !camTween) camera.lookAt(fallbackTarget);
    if (camera.position.y < 0.6) camera.position.y = 0.6;

    // respiración orgánica de la cámara
    const s = camTween ? 0 : 1;
    sway.set(Math.sin(t * 0.5) * 0.07 * s, Math.sin(t * 0.8) * 0.1 * s, Math.cos(t * 0.4) * 0.05 * s);
    camera.position.add(sway);
    render();
    camera.position.sub(sway);

    // respaldo automático de rendimiento en móviles antiguos
    if (introDone && !perfDone && composer) {
      perfN++; if (perfN > 60) perfAcc += raw;
      if (perfN === 180) {
        perfDone = true;
        if (perfAcc / 120 > 0.045) { composer = null; renderer.setPixelRatio(1); U.pr.value = 1; onResize(); console.info('Modo ligero activado'); }
      }
    }
  }

  // ─────────── Inicio ───────────
  camera.position.copy(flyPath(0)); camera.lookAt(0, 12, 0);
  try { renderer.compile(scene, camera); } catch (e) {}

  function start() {
    if (started) return; started = true;
    last = performance.now() / 1000;
    loop();
    const t0 = new THREE.Vector3(0, 12, 0);
    camTween = tween(7.5, (e) => {
      camera.position.copy(flyPath(e));
      tgt.lerpVectors(t0, HOME_TARGET, e); camera.lookAt(tgt);
    }, easeInOutCubic, () => {
      camTween = null; introDone = true;
      if (controls) { controls.enabled = true; controls.update(); scheduleAutoRotate(1500); }
      $('hud').classList.add('show');
      toast(CONFIG.PISTA_INICIAL, 6000);
      setTimeout(() => { if (!waterHintShown && openedCount < 2) { waterHintShown = true; toast(CONFIG.PISTA_AGUA, 5500); } }, 16000);
    });
    // ondas iniciales en el lago
    [0, 1.2, 2.4].forEach((d, i) => setTimeout(() => addRipple(Math.cos(i * 2) * 9, Math.sin(i * 2) * 9, 5), 2500 + d * 1000));
  }

  window.__santuario = { ready: true, start };
  window.dispatchEvent(new Event('santuario-ready'));
}

main().catch((e) => { console.error(e); fail('Algo salió mal al crear el santuario. Recarga la página 💫'); });
</script>
</body>
</html>
